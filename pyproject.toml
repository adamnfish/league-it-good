[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "league-it-good"
version = "2.0.0"
description = "Fantasy Premier League gameweek summary generator"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = []
keywords = ["fpl", "fantasy", "premier league", "football", "statistics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Games/Entertainment",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests>=2.31.0",
    "click>=8.0.0",
    "matplotlib>=3.7",
    "Pillow>=10.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/adamnfish/league-it-good"
Repository = "https://github.com/adamnfish/league-it-good"

[project.scripts]
lig = "src.main:cli"
league-it-good = "src.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.graphs" = ["fonts/*.ttf", "fonts/*.txt", "example_config.toml"]
